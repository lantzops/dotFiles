#################################################
#           Input configuration                 #
#################################################


### Input configuration

input "type:pointer" {
    accel_profile flat
    pointer_accel 0
}

input "type:touchpad" {
    events enabled
    tap enabled
}

###enable numlock on keyboard
input type:keyboard {
      xkb_numlock enabled
}

# Read `man 5 sway-input` for more information about this section.
