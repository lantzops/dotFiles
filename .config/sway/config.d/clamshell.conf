#################################################
#                Clamshell Mode                 #
#################################################

# Clamshell Mode
# Only disables eDP-1 on lid close when an external output is connected.
# Logic lives in clamshell.sh so bindswitch and startup share one code path.
set $clamshell_script ${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/clamshell.sh
bindswitch --reload --locked lid:on exec $clamshell_script
bindswitch --reload --locked lid:off exec $clamshell_script

exec_always $clamshell_script
